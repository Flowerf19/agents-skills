<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover</title>
<style>
  :root {
    --bg-main:#FFFFFF; --bg-header:#000000; --accent:#F85d42; --gray:#74788d;
    --aux1:#556EE6; --aux2:#34c38f; --aux3:#50a5f1; --aux4:#f1b44c;
    --gray-light:#F5F5F5; --page-bg:#e0e0e0;
    --safe:40px; --radius:8px;
    --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html,body{margin:0;background:var(--page-bg);font-family:var(--font);}
  .stage{
    position:relative;width:960px;height:540px;overflow:hidden;
    background:linear-gradient(135deg,#1a1a1a 0%,#3a2018 55%,var(--accent) 100%);
    color:#fff;margin:0 auto;
  }
  .safe{position:absolute;inset:var(--safe);display:flex;flex-direction:column;justify-content:center;}
  .kicker{font-size:16px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:.75;margin-bottom:16px;}
  .title{font-size:44px;font-weight:700;line-height:1.15;margin:0 0 16px;max-width:760px;}
  .subtitle{font-size:20px;font-weight:400;color:#f2d8cf;max-width:680px;}
  .rule{width:64px;height:4px;background:var(--accent);margin-top:28px;border-radius:2px;}
</style>
</head>
<body>
  <div class="stage">
    <div class="safe">
      <div class="kicker">{{KICKER}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <div class="subtitle">{{SUBTITLE}}</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
